name: 'Tokenectomy Bot PR Gate'
description: 'Deterministic AST-based PR reviewer catching structural bugs, security holes, and AI agent test tampering.'
author: 'Tokenectomy Labs'

inputs:
  base:
    description: 'Base git reference'
    required: false
    default: 'origin/main'
  head:
    description: 'Head git reference'
    required: false
    default: 'HEAD'
  fail_on:
    description: 'Failure threshold (error, warn, none)'
    required: false
    default: 'error'
  format:
    description: 'Report output format (text, json, sarif, github, summary, review-batch)'
    required: false
    default: 'github'
  agent_pr:
    description: 'Enforce Agent PR mode (escalate anti-tampering rules to error)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Run Tokenectomy Bot
      shell: bash
      run: |
        AGENT_FLAG=""
        if [ "${{ inputs.agent_pr }}" = "true" ]; then
          AGENT_FLAG="--agent-pr"
        fi

        cargo run --quiet -p tb-cli -- review \
          --base "${{ inputs.base }}" \
          --head "${{ inputs.head }}" \
          --fail-on "${{ inputs.fail_on }}" \
          --format "${{ inputs.format }}" \
          $AGENT_FLAG
