name: Tokenectomy Bot PR Gate (Dogfooding)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gate:
    name: Deterministic AST Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Tokenectomy Bot PR Gate
        uses: ./
        with:
          base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          head: HEAD
          pr_comment: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          auto_fix: 'false'
          github_token: ${{ secrets.GITHUB_TOKEN }}
