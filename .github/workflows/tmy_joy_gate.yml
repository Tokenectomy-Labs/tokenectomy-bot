name: Tokenectomy Bot PR Gate (Dogfooding)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Deterministic AST Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Tokenectomy Bot PR Gate
        uses: ./
        with:
          base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          head: HEAD
          pr_comment: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          auto_fix: 'false'
          github_token: ${{ secrets.GITHUB_TOKEN }}
