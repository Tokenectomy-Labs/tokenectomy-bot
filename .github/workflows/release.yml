name: Release & Marketplace Distribution

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-release:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: tokenectomy-bot
            archive_name: tokenectomy-bot-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: tokenectomy-bot
            archive_name: tokenectomy-bot-linux-aarch64.tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: tokenectomy-bot
            archive_name: tokenectomy-bot-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: tokenectomy-bot
            archive_name: tokenectomy-bot-macos-arm64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: tokenectomy-bot.exe
            archive_name: tokenectomy-bot-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p tb-cli
          else
            cargo build --release --target ${{ matrix.target }} -p tb-cli
          fi

      - name: Archive binary
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${{ matrix.archive_name }}" "$BIN_PATH" README.md LICENSE schema.json
          else
            tar -czvf "${{ matrix.archive_name }}" -C "target/${{ matrix.target }}/release" "${{ matrix.bin_name }}"
          fi

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba7737a62ae517 # v2.2.3
        with:
          subject-path: ${{ matrix.archive_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: ${{ matrix.archive_name }}

  update-major-tag:
    name: Update Major Version Tag (v1)
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Update moving v1 tag
        run: |
          MAJOR_TAG="v1"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR_TAG" -m "Release $MAJOR_TAG ($GITHUB_REF_NAME)"
          git push origin "$MAJOR_TAG" --force
