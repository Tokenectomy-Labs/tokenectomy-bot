[workspace]
members = [
    "crates/tb-diff",
    "crates/tb-parse",
    "crates/tb-rules",
    "crates/tb-report",
    "crates/tb-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Tokenectomy Labs"]
license = "MIT"
repository = "https://github.com/Tokenectomy-Labs/tokenectomy-bot"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
colored = "3.1.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tree-sitter = "0.27.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-rust = "0.24.2"
walkdir = "2.5.0"
tempfile = "3.16.0"

# Internal workspace crates
tb-diff = { path = "crates/tb-diff" }
tb-parse = { path = "crates/tb-parse" }
tb-rules = { path = "crates/tb-rules" }
tb-report = { path = "crates/tb-report" }
